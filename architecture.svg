<text x="30" y="736" text-anchor="start" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" fill="#0f172a" font-weight="700">Upload flow:</text>
<text x="125" y="736" text-anchor="start" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#334155">1 browser uploads PDF  >  2 backend saves it in S3  >  3 Textract extracts text per page  >  4 chunks + vectors saved to the S3 index</text>
<text x="30" y="760" text-anchor="start" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="13" fill="#0f172a" font-weight="700">Question flow:</text>
<text x="135" y="760" text-anchor="start" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#334155">1 retrieve top chunks  >  2 send only those chunks to the LLM (Bedrock first, Gemini now)  >  3 answer + citations (document, page, passage)</text>
<text x="30" y="784" text-anchor="start" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748b">Dashed = unavailable or fallback path.  Out-of-scope questions return no chunks, so the app answers: Information not available in the uploaded documents.</text>
